version: "3"

services:
  stationdb:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ciclo
      POSTGRES_PASSWORD: ciclo
      POSTGRES_DB: ciclo_dev
    ports:
      - "5433:5432"
    volumes:
      - stationdb_data:/var/lib/postgresql/data
      - ./db/init-queries:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciclo -d ciclo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  martin:
    image: ghcr.io/maplibre/martin:latest
    restart: unless-stopped
    ports:
      - "${MARTIN_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://ciclo:ciclo@stationdb:5432/ciclo_dev
      RUST_LOG: info,martin=warn
    volumes:
      - ./data:/app/data
    command: ["postgres://ciclo:ciclo@stationdb:5432/ciclo_dev", "/app/data"]
    depends_on:
      stationdb:
        condition: service_healthy

  ciclo-py:
    build:
      context: ./api
      dockerfile: Dockerfile_macos
    volumes:
      - ./api/app:/app
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      HOST: ${HOST}
      PORT: ${PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      COLORTERM: truecolor
      TERM: xterm-256color
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      H3_LEVEL: ${H3_LEVEL}
      RADIUS_ACCESS: ${RADIUS_ACCESS}
      HIGH_IMPEDANCE: ${HIGH_IMPEDANCE}
      MEDIUM_IMPEDANCE: ${MEDIUM_IMPEDANCE}
      LOW_IMPEDANCE: ${LOW_IMPEDANCE}
      ELSE_IMPEDANCE: ${ELSE_IMPEDANCE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on: 
      - stationdb
      - martin

volumes:
  stationdb_data:
